server.port=8081
spring.datasource.url=jdbc:h2:mem:booksdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:10.160.1.86:9092}
spring.kafka.consumer.group-id=books-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=org.javacream.books.events.StockChangedEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=org.javacream.books.events
spring.kafka.consumer.properties.spring.json.use.type.headers=false
logging.level.org.springframework.kafka=DEBUG